name: e2e

# Packs the package once, then installs that tarball from a local registry with every
# supported launcher (npx, bunx, pnpm dlx, yarn) on every OS. Callers publish this
# exact artifact, so what ships is what was tested.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: mkdir -p dist && npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: dist/*.tgz
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.os }}, node ${{ matrix.node }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
        include:
          - os: ubuntu-latest
            node: "24"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: dist
      - name: e2e against the packed tarball
        env:
          GRUNT_E2E_ROOT: ${{ runner.temp }}/grunt-e2e
          GRUNT_E2E_KEEP: "1"
        run: |
          mkdir -p "$GRUNT_E2E_ROOT"
          GRUNT_E2E_TARBALL="$(ls dist/*.tgz)" npm run test:e2e
      - name: upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/grunt-e2e/**/logs/**
            ${{ runner.temp }}/grunt-e2e/**/verdaccio.log
          if-no-files-found: ignore
