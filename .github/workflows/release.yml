name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0). Empty = this ref."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  npmjs:
    name: npmjs.com
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Publish to registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          if npm view "@lovrozagar/grunt@$tag" version >/dev/null 2>&1; then
            echo "npm already has @lovrozagar/grunt@$tag — skipping"
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "secrets.NPM_TOKEN is empty"
            echo "gh secret set NPM_TOKEN  (classic npm token)"
            echo "optional: npm Trusted Publisher → GitHub Actions / lovrozagar / grunt / release.yml"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            if npm publish --access public --provenance; then
              exit 0
            fi
            echo "provenance publish failed — retrying without --provenance (classic token)"
          fi
          npm publish --access public

  github-release:
    name: GitHub Release
    needs: npmjs
    if: ${{ !cancelled() && needs.npmjs.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --generate-notes --title "${tag#v}"
          fi
