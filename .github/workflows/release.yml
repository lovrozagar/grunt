name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0). Empty = this ref."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  # A release commit already went through ci (the release skill waits for it), so its tag only packs and publishes.
  ci:
    name: ci passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')"
          if [ "$n" -gt 0 ]; then passed=true; else passed=false; fi
          echo "ci passed on ${{ github.sha }}: $passed"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: ci
    if: ${{ needs.ci.outputs.passed != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e
    needs: ci
    uses: ./.github/workflows/e2e.yml
    with:
      pack-only: ${{ needs.ci.outputs.passed == 'true' }}

  npmjs:
    name: npmjs.com
    needs: [test, e2e]
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.test.result) && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: dist
      - name: Check tag matches the tested tarball
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          pkg="$(tar -xOzf dist/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Publish to registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          if npm view "@lovrozagar/grunt@$tag" version >/dev/null 2>&1; then
            echo "npm already has @lovrozagar/grunt@$tag — skipping"
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "secrets.NPM_TOKEN is empty"
            echo "gh secret set NPM_TOKEN  (classic npm token)"
            echo "optional: npm Trusted Publisher → GitHub Actions / lovrozagar / grunt / release.yml"
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            # `./` matters: npm reads a bare `dist/x.tgz` as a GitHub user/repo spec.
            if npm publish ./dist/*.tgz --access public --provenance; then
              exit 0
            fi
            echo "provenance publish failed — retrying without --provenance (classic token)"
          fi
          npm publish ./dist/*.tgz --access public

  github-packages:
    name: GitHub Packages
    needs: [test, e2e]
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.test.result) && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@lovrozagar"
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: dist
      - name: Check tag matches the tested tarball
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          pkg="$(tar -xOzf dist/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Publish to npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          if npm view "@lovrozagar/grunt@$tag" --registry=https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "GitHub Packages already has @lovrozagar/grunt@$tag — skipping"
            exit 0
          fi
          npm publish ./dist/*.tgz --access public

  github-release:
    name: GitHub Release
    needs: [npmjs, github-packages]
    if: ${{ !cancelled() && needs.npmjs.result == 'success' && needs.github-packages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --generate-notes --title "${tag#v}"
          fi
